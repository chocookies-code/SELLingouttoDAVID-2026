<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Link RSVP WhatsApp</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
    }

    h2 {
      margin-top: 0;
      color: #075e54;
      font-size: 22px;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
      font-size: 14px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #25d366;
    }

    textarea {
      resize: vertical;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-whatsapp {
      background-color: #25d366;
      color: white;
    }

    .btn-whatsapp:hover {
      background-color: #128c7e;
    }

    .btn-copy {
      background-color: #eceff1;
      color: #455a64;
    }

    .btn-copy:hover {
      background-color: #cfd8dc;
    }

    .result-box {
      margin-top: 20px;
      padding: 12px;
      background-color: #e8f5e9;
      border-radius: 8px;
      border: 1px solid #c8e6c9;
      word-break: break-all;
      font-size: 13px;
    }

    .result-box a {
      color: #075e54;
      text-decoration: none;
      font-weight: 600;
    }

    .result-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>RSVP WhatsApp Link Generator</h2>

    <div class="form-group">
      <label for="phone">Nomor WhatsApp (Gunakan Kode Negara 62):</label>
      <input type="text" id="phone" value="628123456789" placeholder="Contoh: 628123456789">
    </div>

    <div class="form-group">
      <label for="message">Format Pesan RSVP:</label>
      <textarea id="message" rows="6">Halo, saya mau konfirmasi kehadiran untuk RSVP Acara Pernikahan.

Nama: 
Jumlah Tamu: 
Status: (Hadir / Tidak Hadir)</textarea>
    </div>

    <div class="btn-group">
      <button class="btn-whatsapp" onclick="generateAndOpen()">Buka di WA</button>
      <button class="btn-copy" onclick="copyLink()">Salin Link</button>
    </div>

    <div class="result-box" id="resultContainer" style="display: none;">
      <strong>Hasil Link RSVP:</strong><br>
      <a id="generatedUrl" href="#" target="_blank">-</a>
    </div>
  </div>

  <script>
    function buildWaUrl() {
      let phone = document.getElementById('phone').value.trim();
      let message = document.getElementById('message').value;

      // Hapus karakter selain angka
      phone = phone.replace(/[^0-9]/g, '');

      // Jika user menulis diawali angka '0', ubah ke kode negara '62' secara otomatis
      if (phone.startsWith('0')) {
        phone = '62' + phone.slice(1);
      }

      // Encode pesan teks agar format baris baru dan spasi aman di URL
      const encodedMessage = encodeURIComponent(message);
      return `https://wa.me/${phone}?text=${encodedMessage}`;
    }

    function generateAndOpen() {
      const waUrl = buildWaUrl();
      
      // Tampilkan hasil di kotak link
      const linkElem = document.getElementById('generatedUrl');
      linkElem.href = waUrl;
      linkElem.innerText = waUrl;
      document.getElementById('resultContainer').style.display = 'block';

      // Buka tab WhatsApp
      window.open(waUrl, '_blank');
    }

    function copyLink() {
      const waUrl = buildWaUrl();
      
      // Salin teks link ke clipboard
      navigator.clipboard.writeText(waUrl).then(() => {
        alert("Link RSVP berhasil disalin!");
      }).catch(err => {
        console.error('Gagal menyalin link: ', err);
      });

      // Tampilkan hasil di halaman
      const linkElem = document.getElementById('generatedUrl');
      linkElem.href = waUrl;
      linkElem.innerText = waUrl;
      document.getElementById('resultContainer').style.display = 'block';
    }
  </script>

</body>
</html>
