<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Pernikahan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container Pembatas Layar HP (Mobile-First Frame) */
    .mobile-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 900px;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    /* ==========================================
       1. HALAMAN COVER (cover-ktlg.png)
       ========================================== */
    #cover-section {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('cover-ktlg.png') center/cover no-repeat;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 60px 20px 40px 20px;
      text-align: center;
      transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
    }

    /* Class untuk menyembunyikan cover setelah diklik */
    #cover-section.hide {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .cover-top {
      color: #d4af37; /* Warna Emas */
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .cover-top h3 {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .cover-top h1 {
      font-size: 26px;
      font-family: serif;
    }

    /* Box Overlay untuk Tamu Undangan agar Teks Terbaca Jelas */
    .guest-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(5px);
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 85%;
      border: 1px solid #d4af37;
    }

    .guest-card p {
      font-size: 13px;
      color: #555;
      margin-bottom: 5px;
    }

    .guest-card h2 {
      font-size: 20px;
      color: #222;
      font-weight: 600;
    }

    .btn-open {
      background: linear-gradient(135deg, #d4af37, #aa8c2c);
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }

    .btn-open:hover {
      transform: scale(1.05);
    }

    /* ==========================================
       2. HALAMAN UTAMA (bg-main-kltg.png)
       ========================================== */
    #main-section {
      width: 100%;
      min-height: 100%;
      background: url('bg-main-kltg.png') center/cover no-repeat;
      padding: 40px 20px;
      color: #333;
      text-align: center;
    }

    .main-header {
      color: #d4af37;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      margin-bottom: 30px;
    }

    .main-header h2 {
      letter-spacing: 4px;
      font-size: 18px;
    }

    .main-header p {
      font-size: 11px;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    /* Card Profil Pengantin dengan Overlay Transparan */
    .profile-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      padding: 25px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .profile-card h3 {
      font-size: 24px;
      color: #b8860b;
      margin-bottom: 5px;
    }

    .profile-card .sub-text {
      font-size: 12px;
      color: #777;
    }

    .profile-card .parents {
      font-size: 14px;
      font-weight: bold;
      color: #333;
      margin: 8px 0;
    }

    .profile-card .social {
      font-size: 12px;
      color: #b8860b;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    
    <!-- HALAMAN COVER -->
    <div id="cover-section">
      <div class="cover-top">
        <h3>Wedding Invitation</h3>
        <h1>Romeo & Partner</h1>
      </div>

      <div class="guest-card">
        <p>Kepada Yth. Bapak/Ibu/Saudara/i:</p>
        <h2 id="guest-name">Nama Tamu Undangan</h2>
      </div>

      <button class="btn-open" onclick="openInvitation()">Buka Undangan</button>
    </div>

    <!-- HALAMAN UTAMA -->
    <div id="main-section">
      <div class="main-header">
        <h2>BRIDE & GROOM</h2>
        <p>WE ARE GETTING MARRIED</p>
      </div>

      <!-- Detail Pengantin Pria -->
      <div class="profile-card">
        <h3>Romeo</h3>
        <p class="sub-text">Son of</p>
        <p class="parents">Mr. Anton & Mrs. Yuni</p>
        <a href="#" class="social">@romeo</a>
      </div>

      <!-- Tempat Tambahan Pasangan Wanita / Acara -->
      <div class="profile-card">
        <h3>Partner</h3>
        <p class="sub-text">Daughter of</p>
        <p class="parents">Mr. Father & Mrs. Mother</p>
        <a href="#" class="social">@partner</a>
      </div>
    </div>

  </div>

  <script>
    // 1. Ambil Nama Tamu dari URL Parameter (Contoh: website.com/?to=Budi+Santoso)
    const urlParams = new URLSearchParams(window.location.search);
    const guestName = urlParams.get('to');
    
    if (guestName) {
      document.getElementById('guest-name').innerText = guestName;
    }

    // 2. Fungsi Tombol Open Invitation
    function openInvitation() {
      document.getElementById('cover-section').classList.add('hide');
    }
  </script>

</body>
</html>
